# Copy to config.yaml and adjust. Contract addresses: verify at https://contracts.overtime.io/

agent:
  poll_interval_seconds: 5
  db_path: data/agent.db
  kill_switch_path: data/kill-switch.flag
  log_path: data/agent.jsonl
  timezone: Europe/Amsterdam
  # Rich logging: fixture_key, kickoff, odds metadata on every quote snapshot
  ticket_sampling_enabled: true
  ticket_sample_every_n_polls: 12   # ~60s at 5s polls
  ticket_sample_limit: 100

cost_floor:
  min_edge_pct: 6.0
  safety_buffer_pct: 0.5
  overtime_fee_pct_per_leg: 2.0
  bridge_fee_pct: 0.04
  slippage_pct_per_leg: 0.75

risk:
  max_bankroll_usdc: 200
  per_trade_usdc_cap: 5
  per_event_exposure_usdc: 20
  daily_loss_cap_usdc: 20
  min_chain_balance_usd: 20
  min_gas_eth: 0.0005
  max_bridges_per_day: 3
  max_orders_per_chain_per_minute: 10

execution:
  # auto: use OVERTIME_API_KEY + REST if set, else on-chain tradeQuote/trade (merkle from subgraph)
  mode: auto
  dry_run_quote_onchain: true

overtime_api:
  base_url: https://api.overtime.io
  # data_source: subgraph (default) | rest | auto
  # Detection uses the public SportsMarketsV2 subgraph (no Overtime REST approval needed).
  # OVERTIME_API_KEY is only for gated REST quotes / live execution payloads.
  data_source: subgraph

across:
  api_url: https://app.across.to/api
  # Spoke pool addresses per chain — verify on Across docs before live bridging

chains:
  base:
    chain_id: 8453
    name: base
    rpc_urls:
      - https://mainnet.base.org
    sports_amm_v2: "0xa1ead27ebbd90b8ef385f264cc66ba4c96767fdf"
    usdc: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    native_symbol: ETH

  optimism:
    chain_id: 10
    name: optimism
    rpc_urls:
      - https://mainnet.optimism.io
    sports_amm_v2: "0xFb4e4811C7A811E098A556bD79B64c20b479E431"
    usdc: "0x0b2C639c5338137C4aa58B0cAe1a9CfBe376e89Fd"
    native_symbol: ETH

  arbitrum:
    chain_id: 42161
    name: arbitrum
    rpc_urls:
      - https://arb1.arbitrum.io/rpc
    # Verify on contracts.overtime.io — update if deployment changes
    sports_amm_v2: "0xFb4e4811C7A811E098A556bD79B64c20b479E431"
    usdc: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
    native_symbol: ETH
